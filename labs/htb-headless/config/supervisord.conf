[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisor/supervisord.pid
user=root

[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:flask]
command=/opt/venv/bin/python /home/dvir/app/app.py
directory=/home/dvir/app
user=dvir
priority=20
autostart=true
autorestart=true
startsecs=3
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:admin-review]
command=/opt/venv/bin/python /home/dvir/app/inspect_reports.py
directory=/home/dvir/app
user=dvir
priority=30
autostart=true
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
