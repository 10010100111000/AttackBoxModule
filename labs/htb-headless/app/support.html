<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headless - Support</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#e7edf2;font-family:Arial,sans-serif}
main{width:min(720px,calc(100% - 32px));margin:56px auto;padding:38px;background:#17232d;border:1px solid #34414c}
h1{margin-top:0}p{color:#aebbc5}label{display:block;margin:16px 0 6px;color:#cbd5dc}
input,textarea{width:100%;padding:11px;color:#e7edf2;background:#0e171e;border:1px solid #465662}
textarea{min-height:120px;resize:vertical}button{margin-top:20px;padding:12px 22px;border:0;background:#e4a84c;color:#101820;font-weight:700;cursor:pointer}
a{color:#e4a84c}
</style></head>
<body><main>
<h1>Contact Support</h1><p>Have a question? Send our support team a message.</p>
<form method="post" action="/support">
<label for="fname">First Name</label><input id="fname" name="fname" required>
<label for="lname">Last Name</label><input id="lname" name="lname" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="phone">Phone</label><input id="phone" name="phone" required>
<label for="message">Message</label><textarea id="message" name="message" required></textarea>
<button type="submit">Submit</button>
</form><p><a href="/">Back</a></p>
</main></body></html>
