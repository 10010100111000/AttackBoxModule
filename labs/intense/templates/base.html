<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Intense{% endblock %} · WebApp</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">I</span><span>Intense <small>WebApp</small></span></a><nav><a href="{{ url_for('index') }}">Home</a>{% if user %}<a href="{{ url_for('submit') }}">Submit</a>{% endif %}{% if user and user.role == 1 %}<a href="/admin">Admin</a>{% endif %}{% if user %}<a href="{{ url_for('logout') }}">Logout</a>{% else %}<a href="{{ url_for('login') }}">Login</a>{% endif %}</nav></header><main class="container">{% block content %}{% endblock %}</main><footer class="footer">Intense WebApp <span>·</span> Community message service</footer></body></html>
