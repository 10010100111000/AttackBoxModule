log_format union_ci '$remote_addr [$time_local] "$request" $status $body_bytes_sent "xff=$http_x_forwarded_for"';
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;
    access_log /dev/stdout union_ci;
    error_log /dev/stderr notice;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
}
