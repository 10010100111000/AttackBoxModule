options {
    directory "/var/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
    pid-file "/run/named/named.pid";
};

zone "trick.htb" {
    type master;
    file "/var/bind/trick.htb.zone";
    allow-transfer { any; };
};
