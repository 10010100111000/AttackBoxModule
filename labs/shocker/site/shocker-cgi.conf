# Apache's NATIVE CGI executes an original unpatched GNU Bash 4.3 interpreter.
# No simulated Shellshock string matching or non-CGI web backend.
LoadModule cgi_module modules/mod_cgi.so
ScriptAlias /cgi-bin/ "/usr/lib/cgi-bin/"
<Directory "/usr/lib/cgi-bin">
    Options +ExecCGI -Indexes
    AllowOverride None
    Require all granted
    AddHandler cgi-script .sh
</Directory>
