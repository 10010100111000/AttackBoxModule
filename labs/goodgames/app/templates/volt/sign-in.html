{% extends 'layouts/base-auth.html' %}
{% block content %}
<section class="vh-lg-100 mt-5 mt-lg-0 bg-soft d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 d-flex align-items-center justify-content-center">
        <div class="bg-white shadow border-0 rounded border-light p-4 p-lg-5 w-100" style="max-width:480px">
          <div class="text-center mb-4"><h1 class="mb-1 h3">Sign in to your account</h1><p class="text-gray-500">GoodGames internal administration</p></div>
          {% if error %}<div class="alert alert-danger" role="alert">Invalid username or password.</div>{% endif %}
          <form method="POST" action="/login" class="mt-4">
            <div class="form-group mb-4"><label for="username">Username</label><input class="form-control" id="username" name="username" type="text" placeholder="admin" required autofocus></div>
            <div class="form-group mb-4"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" placeholder="Password" required></div>
            <button type="submit" class="btn btn-gray-800 w-100">Sign in</button>
          </form>
          <div class="d-flex justify-content-center mt-4"><span class="text-gray-500 small">Authorized personnel only</span></div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
