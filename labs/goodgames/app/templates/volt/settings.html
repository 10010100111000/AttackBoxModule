{% extends 'layouts/base.html' %}
{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4"><div><h1 class="h2">User Settings</h1><p class="mb-0 text-gray-600">Update your profile information.</p></div></div>
<div class="row">
  <div class="col-12 col-xl-8">
    <div class="card card-body border-0 shadow mb-4">
      <h2 class="h5 mb-4">General information</h2>
      <form method="POST" action="/settings">
        <div class="row">
          <div class="col-md-6 mb-3"><label for="name">Username</label><input class="form-control" id="name" name="name" type="text" value="{{ profile_name }}" required></div>
          <div class="col-md-6 mb-3"><label for="email">Email</label><input class="form-control" id="email" type="email" value="{{ profile_email }}" readonly></div>
        </div>
        <div class="mt-3"><button class="btn btn-gray-800" type="submit">Save all</button></div>
      </form>
    </div>
  </div>
  <div class="col-12 col-xl-4"><div class="card border-0 shadow mb-4"><div class="card-body"><h2 class="h5">Profile</h2><p class="text-gray-600">Administrator account</p><span class="badge bg-primary">Superuser</span></div></div></div>
</div>
{% endblock %}
