# Deliberately permissive Apache configuration for the isolated Base training lab.
<Directory /var/www/html>
    Options +Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

<Directory /var/www/html/login>
    Options +Indexes
    Require all granted
</Directory>

<Directory /var/www/html/_uploaded>
    Options +Indexes
    AllowOverride All
    Require all granted
</Directory>
