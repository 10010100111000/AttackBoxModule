# Discoverable by PHP foothold; two real virtual hosts.
server {
 listen 8080 default_server;
 server_name soccer.htb _;
 root /var/www/html;
 index index.html;
 location /tiny/ { index index.php; }
 location ~ ^/tiny/.*\.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass 127.0.0.1:9000; }
 location ~ \.php$ { return 404; }
}
server {
 listen 8080;
 server_name soc-player.soccer.htb;
 location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
}
