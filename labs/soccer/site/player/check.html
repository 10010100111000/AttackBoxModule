<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check Ticket | Soccer</title><style>body{background:#091b2b;color:#fff;font:17px system-ui;margin:0}main{max-width:800px;padding:60px;margin:auto}input,button{padding:14px;border:0;border-radius:5px}button{background:#65dba2;cursor:pointer}</style></head><body><main><p>SOCCER // MEMBER SERVICE</p><h1>Check a ticket</h1><p>Enter your match ticket ID to confirm it is in the database.</p><form id="check"><input id="ticket" value="86881" aria-label="Ticket ID"><button>Check</button></form><p id="result" aria-live="polite"></p></main><script>const result=document.querySelector('#result');document.querySelector('#check').onsubmit=e=>{e.preventDefault();result.textContent='Checking...';const ws=new WebSocket(`ws://${location.hostname}:9091`);ws.onopen=()=>ws.send(JSON.stringify({id:document.querySelector('#ticket').value}));ws.onmessage=e=>{result.textContent=e.data;ws.close()};ws.onerror=()=>{result.textContent='Service unavailable'}}</script></body></html>
