# Proposed original port mapping. Enable only with genuine ZoneMinder 1.29.0.
Listen 3305

<VirtualHost *:80>
    ServerName pebbles.local
    DocumentRoot /var/www/pebbles
    <Directory /var/www/pebbles>
        Require all granted
        AllowOverride None
    </Directory>
    # Add genuine upstream ZoneMinder /zm Apache configuration when installed.
</VirtualHost>

<VirtualHost *:3305>
    ServerName pebbles-zm.local
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
        AllowOverride None
    </Directory>
    # Use the REAL ZoneMinder /zm alias, not a dummy SQLi script.
</VirtualHost>
