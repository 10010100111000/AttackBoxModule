# 80 Pebbles PHP; 3305 Apache default + genuine ZoneMinder /zm;
# 8080 Apache proxy to original Tomcat 9.0.30 on 127.0.0.1:18080.
Listen 3305
Listen 8080
ServerName pebbles.local

<VirtualHost *:80>
    ServerName pebbles.local
    DocumentRoot /var/www/pebbles
    <Directory /var/www/pebbles>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/log/apache2/pebbles-80-error.log
</VirtualHost>

<VirtualHost *:3305>
    ServerName pebbles-zm.local
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/log/apache2/pebbles-3305-error.log
</VirtualHost>

<VirtualHost *:8080>
    ServerName pebbles-tomcat.local
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18080/
    ProxyPassReverse / http://127.0.0.1:18080/
    ErrorLog /var/log/apache2/pebbles-8080-error.log
</VirtualHost>
