name: Compare Pebbles lean multi-stage runtime

on:
  pull_request:
    paths:
      - 'labs/pebbles/Dockerfile.lean'
      - '.github/workflows/pebbles-lean-compare.yml'
  workflow_dispatch:

concurrency:
  group: pebbles-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build current and experimental runtime images
        run: |
          set -euo pipefail
          docker build --progress=plain -f labs/pebbles/Dockerfile -t ttp-pebbles:baseline labs/pebbles
          docker build --progress=plain -f labs/pebbles/Dockerfile.lean --target xenial-assembled -t ttp-pebbles:lean-layered labs/pebbles
          docker build --progress=plain -f labs/pebbles/Dockerfile.lean -t ttp-pebbles:lean labs/pebbles

      - name: Measure exact image sizes and InnoDB redo files
        run: |
          set -euo pipefail
          original=$(docker image inspect -f '{{.Size}}' ttp-pebbles:baseline)
          lean=$(docker image inspect -f '{{.Size}}' ttp-pebbles:lean)
          layered=$(docker image inspect -f '{{.Size}}' ttp-pebbles:lean-layered)
          printf 'Baseline image: %s bytes\nLayered Xenial candidate: %s bytes\nSingle-layer repack: %s bytes\n' "$original" "$layered" "$lean"
          docker run --rm --network none --entrypoint sh ttp-pebbles:lean -c 'ls -l /var/lib/mysql/ib_logfile*; test -x /usr/sbin/mysqld; test -f /usr/share/zoneminder/www/ajax/log.php'
          docker run --rm --network none --entrypoint sh ttp-pebbles:lean-layered -c 'test -x /usr/sbin/mysqld; test -f /usr/share/zoneminder/www/ajax/log.php'
          echo '### Pebbles size comparison' >> "$GITHUB_STEP_SUMMARY"
          awk -v old="$original" -v new="$lean" -v layered="$layered" 'BEGIN {printf "Baseline: %.1f MiB; layered (shared Ubuntu base): %.1f MiB; scratch repack: %.1f MiB\n", old/1048576,layered/1048576,new/1048576; printf "Layered savings: %.1f MiB; flat savings: %.1f MiB\n", (old-layered)/1048576,(old-new)/1048576}' | tee -a "$GITHUB_STEP_SUMMARY"
          if (( lean >= original )); then
            echo "FAIL: additional stages did not actually reduce the final image size" >&2
            exit 1
          fi

      - name: Build UDF test-only helper in separate image
        run: docker build -f labs/pebbles/tests/Dockerfile.udf-probe -t ttp-pebbles-udf:ci labs/pebbles/tests

      - name: Verify original ZoneMinder SQLi to system execution chain
        env:
          PEBBLES_TEST_SQLI: '1'
          PEBBLES_TEST_UDF: '1'
        run: bash labs/pebbles/tests/service-smoke.sh ttp-pebbles:lean

      - name: Verify original attacker-visible ports and discovery sequence
        run: bash labs/pebbles/tests/remote-recon.sh ttp-pebbles:lean

      - name: Check Worker memory and PIDs
        run: bash labs/pebbles/tests/resource-profile.sh ttp-pebbles:lean

      - name: Verify private static root Flag and fail-closed requirement
        run: bash labs/pebbles/tests/static-flag-acceptance.sh ttp-pebbles:lean

      - name: Verify per-user isolation and stop-delete-create reset
        run: bash labs/pebbles/tests/reset-acceptance.sh ttp-pebbles:lean
