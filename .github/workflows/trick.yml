name: HTB Trick independent full-chain acceptance

on:
  pull_request:
    paths:
      - "labs/trick/**"
      - ".github/workflows/trick.yml"
      - ".github/workflows/lab-images.yml"
      - "catalog/web-curriculum.json"
  push:
    branches: [main]
    paths:
      - "labs/trick/**"
      - ".github/workflows/trick.yml"
      - ".github/workflows/lab-images.yml"
      - "catalog/web-curriculum.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trick-full-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build the single-container Trick target
        run: docker build --progress=plain -t ttp-trick:ci -f labs/trick/Dockerfile labs/trick

      - name: Measure target image size
        run: |
          bytes="$(docker image inspect ttp-trick:ci --format '{{.Size}}')"
          echo "Trick target image bytes: $bytes"
          test "$bytes" -le $((220 * 1024 * 1024))

      - name: Build independent learner / attacker
        run: docker build --progress=plain -t ttp-trick-attacker:ci -f labs/trick/tests/Dockerfile.attacker labs/trick/tests

      - name: Prove the complete player-to-Root-Flag chain and reset
        shell: bash
        env:
          USER_FLAG: "TTP{trick_ci_user_first_2026}"
          ROOT_FLAG: "TTP{trick_ci_root_first_2026}"
          USER_FLAG_RESET: "TTP{trick_ci_user_reset_2026}"
          ROOT_FLAG_RESET: "TTP{trick_ci_root_reset_2026}"
        run: |
          set -euo pipefail
          network=trick-ci
          cleanup() {
            docker logs trick-target 2>/dev/null || true
            docker rm -f trick-target 2>/dev/null || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          docker network create --internal "$network"
          trap cleanup EXIT

          start_target() {
            docker run -d --name trick-target --network "$network" \
              --network-alias trick-target \
              --cap-add NET_ADMIN \
              --memory 512m --cpus 2 --pids-limit 256 \
              -e TRICK_STATIC_USER_FLAG="$1" \
              -e TRICK_STATIC_ROOT_FLAG="$2" \
              ttp-trick:ci

            for i in $(seq 1 120); do
              state="$(docker inspect -f '{{.State.Status}}' trick-target)"
              if [ "$state" != running ]; then
                docker logs trick-target
                return 1
              fi
              health="$(docker inspect -f '{{.State.Health.Status}}' trick-target)"
              if [ "$health" = healthy ]; then
                return 0
              fi
              if [ "$health" = unhealthy ]; then
                docker inspect --format '{{range .State.Health.Log}}{{println .Output}}{{end}}' trick-target
                docker logs trick-target
                return 1
              fi
              sleep 2
            done
            docker logs trick-target
            return 1
          }

          start_target "$USER_FLAG" "$ROOT_FLAG"

          python3 <<'PY'
          import json, subprocess
          state = json.loads(subprocess.check_output(["docker", "inspect", "trick-target"]))[0]
          host = state["HostConfig"]
          assert host["NetworkMode"] == "trick-ci", host["NetworkMode"]
          assert host["Privileged"] is False
          assert {cap.removeprefix("CAP_") for cap in (host.get("CapAdd") or [])} == {"NET_ADMIN"}, host.get("CapAdd")
          assert not state.get("Mounts"), state.get("Mounts")
          assert not host.get("PortBindings"), host.get("PortBindings")
          print("PASS: private network, NET_ADMIN only, no privileged mode, host mounts or published ports")
          PY

          docker run --rm --network "$network" --memory 256m --cpus 1 \
            -e EXPECTED_USER_FLAG="$USER_FLAG" \
            -e EXPECTED_ROOT_FLAG="$ROOT_FLAG" \
            ttp-trick-attacker:ci

          docker exec trick-target fail2ban-client status sshd | grep -F "Total banned: 1"
          docker stats --no-stream --format 'Trick target memory: {{.MemUsage}}; PIDs: {{.PIDs}}' trick-target

          docker rm -f trick-target
          start_target "$USER_FLAG_RESET" "$ROOT_FLAG_RESET"
          docker exec trick-target sh -c 'test "$(cat /home/michael/user.txt)" = "$1" && test "$(cat /root/root.txt)" = "$2" && test ! -e /tmp/root.txt' sh "$USER_FLAG_RESET" "$ROOT_FLAG_RESET"
          echo "PASS: a fresh Trick instance has a distinct Flag pair and no prior root-action output"
          docker stats --no-stream --format 'Reset instance memory: {{.MemUsage}}; PIDs: {{.PIDs}}' trick-target
