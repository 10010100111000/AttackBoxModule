name: WonderCMS 3.4.2 authentic XSS browser lab

on:
  push:
    branches: [main]
    paths:
      - "labs/wondercms-xss/**"
      - ".github/workflows/wondercms-xss.yml"
  pull_request:
    paths:
      - "labs/wondercms-xss/**"
      - ".github/workflows/wondercms-xss.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build exact upstream WonderCMS 3.4.2
        run: docker build --progress=plain -t wcms-xss:ci -f labs/wondercms-xss/Dockerfile labs/wondercms-xss
      - name: Build independent Chromium verifier
        run: docker build -t wcms-browser:ci -f labs/wondercms-xss/tests/Dockerfile.browser labs/wondercms-xss/tests
      - name: Report uncompressed target size
        run: docker image inspect wcms-xss:ci --format 'Target image bytes: {{.Size}}'
      - name: Verify real administrator context, browser XSS and fresh reset
        shell: bash
        run: |
          set -euo pipefail
          network=wcms-xss-ci
          target=wondercms-target
          docker network create --internal "$network"
          cleanup() {
            docker logs "$target" 2>/dev/null || true
            docker rm -f "$target" 2>/dev/null || true
            docker network rm "$network" 2>/dev/null || true
          }
          trap cleanup EXIT
          run_target() {
            docker run -d --name "$target" --network "$network" \
              --memory 192m --pids-limit 128 --cpus 1 \
              -e WONDERCMS_REQUIRE_PRIVATE_FLAGS=1 \
              -e WONDERCMS_ADMIN_PASSWORD="$1" \
              -e WONDERCMS_STATIC_XSS_FLAG="$2" wcms-xss:ci
          }
          wait_ready() {
            for n in $(seq 1 40); do
              state=$(docker inspect -f '{{.State.Status}}' "$target")
              if [ "$state" != running ]; then docker logs "$target"; return 1; fi
              health=$(docker inspect -f '{{.State.Health.Status}}' "$target")
              if [ "$health" = healthy ]; then return 0; fi
              if [ "$health" = unhealthy ]; then docker logs "$target"; return 1; fi
              sleep 2
            done
            docker logs "$target"; return 1
          }
          check_browser() {
            docker run --rm --network "$network" --shm-size 256m \
              -e ADMIN_PASSWORD="$1" -e EXPECTED_FLAG="$2" wcms-browser:ci
          }
          run_target 'wcms-ci-admin-password-first!' 'TTP{wcms_ci_browser_first}'
          wait_ready
          check_browser 'wcms-ci-admin-password-first!' 'TTP{wcms_ci_browser_first}'
          docker stats --no-stream --format 'Target memory: {{.MemUsage}}; PIDs: {{.PIDs}}' "$target"
          docker rm -f "$target"
          run_target 'wcms-ci-admin-password-second!' 'TTP{wcms_ci_browser_second}'
          wait_ready
          check_browser 'wcms-ci-admin-password-second!' 'TTP{wcms_ci_browser_second}'
          echo 'PASS: original CMS authentication, actual browser XSS execution and fresh-instance flag reset'
