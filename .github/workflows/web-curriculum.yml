name: Web curriculum consistency

on:
  push:
    branches: [main]
    paths:
      - "catalog/web-competencies.json"
      - "catalog/web-curriculum.json"
      - "docs/WEB_LAB_DESIGN.md"
      - "README.md"
      - "scripts/validate_web_curriculum.py"
      - "scripts/generate_nodeblog_release.py"
      - "scripts/generate_django_debug_release.py"
      - "scripts/generate_cap_release.py"
      - "labs/cap/flags/**"
      - "challenges/idor/cap-packet-drop/**"
      - "challenges/linux-privilege-escalation/cap-setuid/**"
      - "labs/django-debug-xss/flags/**"
      - "challenges/xss/harbor-registry/**"
      - "labs/nodeblog/**"
      - ".github/workflows/web-curriculum.yml"
      - "labs/**/Dockerfile"
  pull_request:
    paths:
      - "catalog/web-competencies.json"
      - "catalog/web-curriculum.json"
      - "docs/WEB_LAB_DESIGN.md"
      - "README.md"
      - "scripts/validate_web_curriculum.py"
      - ".github/workflows/web-curriculum.yml"
      - "labs/**/Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate Academy taxonomy, existing labs and planned scenarios
        run: python3 scripts/validate_web_curriculum.py
      - name: Check Cap Flag generator determinism and Challenge answer consistency
        run: |
          set -euo pipefail
          python3 scripts/generate_cap_release.py --version 0.0.0-ci
          manifest=labs/cap/flags/releases/0.0.0-ci.json
          before=$(sha256sum "$manifest" | cut -d' ' -f1)
          python3 scripts/generate_cap_release.py --version 0.0.0-ci
          after=$(sha256sum "$manifest" | cut -d' ' -f1)
          test "$before" = "$after"
          python3 - <<'PY'
          import json, pathlib, re
          manifest = json.loads(pathlib.Path("labs/cap/flags/releases/0.0.0-ci.json").read_text())
          flags = manifest["flags"]
          assert set(flags) == {"user", "root"} and len(set(flags.values())) == 2
          assert all(re.fullmatch(r"TTP\{[a-z2-7]{16}\}", value) for value in flags.values())
          assert pathlib.Path("labs/cap/flags/user.txt").read_text().strip() == flags["user"]
          assert pathlib.Path("labs/cap/flags/root.txt").read_text().strip() == flags["root"]
          packet = pathlib.Path("challenges/idor/cap-packet-drop/Packet-Drop.md").read_text()
          full = pathlib.Path("challenges/linux-privilege-escalation/cap-setuid/Setuid-Surprise.md").read_text()
          assert packet.count(f'answer: "{flags["user"]}"') == 1
          assert full.count(f'answer: "{flags["user"]}"') == 1
          assert full.count(f'answer: "{flags["root"]}"') == 1
          assert packet.count("kind: flag") == 1 and full.count("kind: flag") == 2
          assert "lab: cap" in packet and "lab: cap" in full
          print("Cap: random Flags, stable same-version manifest, target seed and Challenge answers match: PASS")
          PY

      - name: Check Django Debug XSS Flag generator determinism and answer consistency
        run: |
          set -euo pipefail
          python3 scripts/generate_django_debug_release.py --version 0.0.0-ci
          manifest=labs/django-debug-xss/flags/releases/0.0.0-ci.json
          before=$(sha256sum "$manifest" | cut -d' ' -f1)
          python3 scripts/generate_django_debug_release.py --version 0.0.0-ci
          after=$(sha256sum "$manifest" | cut -d' ' -f1)
          test "$before" = "$after"
          python3 - <<'PY'
          import json, pathlib, re
          manifest = json.loads(pathlib.Path("labs/django-debug-xss/flags/releases/0.0.0-ci.json").read_text())
          flag = manifest["flag"]
          assert re.fullmatch(r"TTP\{[a-z2-7]{16}\}", flag)
          assert pathlib.Path("labs/django-debug-xss/flags/user.txt").read_text().strip() == flag
          challenge = pathlib.Path("challenges/xss/harbor-registry/Harbor-Lights.md").read_text()
          assert challenge.count(f'answer: "{flag}"') == 1
          assert challenge.count("kind: flag") == 1
          assert "lab: django-debug-xss" in challenge
          print("Django Debug XSS: random 80-bit Flag, stable same-version manifest, target seed and Challenge answer match: PASS")
          PY

      - name: Check NodeBlog Flag generator determinism and Challenge stage counts
        run: |
          set -euo pipefail
          python3 scripts/generate_nodeblog_release.py --version 0.0.0-ci
          manifest=labs/nodeblog/flags/releases/0.0.0-ci.json
          before=$(sha256sum "$manifest" | cut -d' ' -f1)
          python3 scripts/generate_nodeblog_release.py --version 0.0.0-ci
          after=$(sha256sum "$manifest" | cut -d' ' -f1)
          test "$before" = "$after"
          python3 - <<'PY'
          import json, pathlib, re
          flags = json.loads(pathlib.Path("labs/nodeblog/flags/releases/0.0.0-ci.json").read_text())["flags"]
          assert len(flags) == 3 and len(set(flags.values())) == 3
          assert all(re.fullmatch(r"TTP\{[a-z2-7]{16}\}", value) for value in flags.values())
          docs = [
            (pathlib.Path("challenges/authentication/nodeblog-nosql/Backstage Pass.md"), 1),
            (pathlib.Path("challenges/file-security/nodeblog-xxe/Paper Trail.md"), 2),
            (pathlib.Path("challenges/integrated/nodeblog-complete/Ghost Session.md"), 3),
          ]
          for path, count in docs:
            text = path.read_text()
            assert text.count("kind: flag") == count, (path, count)
            assert "lab: nodeblog" in text
          print("NodeBlog generator: 3 unique Flags, stable same-version manifest, Challenge stages 1/2/3: PASS")
          PY
