name: Shocker single-instance Shellshock and sudo E2E

on:
  pull_request:
    paths:
      - "labs/shocker/**"
      - "challenges/startpoint/shocker/**"
      - "challenges/command-injection/shocker/**"
      - "challenges/linux-privilege-escalation/shocker/**"
      - ".github/workflows/shocker-e2e.yml"
  push:
    branches: [main]
    paths:
      - "labs/shocker/**"
      - "challenges/startpoint/shocker/**"
      - "challenges/command-injection/shocker/**"
      - "challenges/linux-privilege-escalation/shocker/**"
      - ".github/workflows/shocker-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shocker-full-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check integrated and focused Challenge answers
        run: |
          python3 -m py_compile labs/shocker/tests/attack_path.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          user = Path("labs/shocker/flags/user.txt").read_text().strip()
          root = Path("labs/shocker/flags/root.txt").read_text().strip()
          expected = {
              "challenges/startpoint/shocker/Shocker.md": [user, root],
              "challenges/command-injection/shocker/cgi-shellshock.md": [user],
              "challenges/linux-privilege-escalation/shocker/sudo-perl.md": [root],
          }
          for filename, answers_expected in expected.items():
              path = Path(filename)
              content = path.read_text()
              answers = re.findall(r'(?m)^answer: "([^"]+)"$', content)
              if answers != answers_expected:
                  raise SystemExit(f"Challenge answer mismatch: {filename}")
              if not re.search(r"(?m)^lab: shocker$", content):
                  raise SystemExit(f"Challenge does not reuse the Shocker Lab: {filename}")
          print("PASS: integrated and focused Challenges share one Lab and match its Flag seeds")
          PY

      - name: Build authentic Bash 4.3 and Apache CGI target
        run: docker build --pull --progress=plain -t ttp-shocker:ci -f labs/shocker/Dockerfile labs/shocker

      - name: Build separate non-root HTTP attacker
        run: docker build --pull --progress=plain -t ttp-shocker-attacker:ci -f labs/shocker/tests/Dockerfile.attacker labs/shocker/tests

      - name: Generate one instance's User and Root Flags
        id: flags
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, secrets, os
          def make_flag():
              token = base64.b32encode(secrets.token_bytes(10)).decode().rstrip("=").lower()
              return "TTP{" + token + "}"
          user, root = make_flag(), make_flag()
          while user == root:
              root = make_flag()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in (("user", user), ("root", root)):
                  print("::add-mask::" + value)
                  output.write(name + "=" + value + "\n")
          print("Generated one instance's distinct 80-bit User and Root Flags; values are masked.")
          PY

      - name: Run complete Shellshock to Root path on one clean instance
        env:
          USER_FLAG: ${{ steps.flags.outputs.user }}
          ROOT_FLAG: ${{ steps.flags.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs shocker-target 2>/dev/null || true
            docker rm -f shocker-target 2>/dev/null || true
            docker network rm shocker-e2e 2>/dev/null || true
          }
          trap cleanup EXIT
          docker network create --internal shocker-e2e

          docker run -d \
            --name shocker-target \
            --network shocker-e2e \
            --network-alias shocker-target \
            --memory 96m --cpus 1 --pids-limit 96 \
            -e SHOCKER_REQUIRE_PRIVATE_FLAGS=1 \
            -e SHOCKER_STATIC_USER_FLAG="$USER_FLAG" \
            -e SHOCKER_STATIC_ROOT_FLAG="$ROOT_FLAG" \
            ttp-shocker:ci >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}' shocker-target)
            health=$(docker inspect -f '{{.State.Health.Status}}' shocker-target)
            if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
              docker logs shocker-target
              echo "Shocker failed before becoming healthy"
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1

          docker run --rm \
            --network shocker-e2e \
            -e TARGET_URL=http://shocker-target \
            -e EXPECTED_USER_FLAG="$USER_FLAG" \
            -e EXPECTED_ROOT_FLAG="$ROOT_FLAG" \
            ttp-shocker-attacker:ci

          docker stats --no-stream shocker-target --format "Shocker memory={{.MemUsage}} pids={{.PIDs}}"
          echo "PASS: one fresh instance completed Shellshock, User Flag and sudo Perl Root Flag"

      - name: Record target image size
        if: always()
        run: docker image inspect ttp-shocker:ci --format='IMAGE_SIZE_BYTES={{.Size}}' || true
