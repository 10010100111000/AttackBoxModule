name: Alert real Chromium stored-XSS and Web Flag end-to-end acceptance

on:
  pull_request:
    paths:
      - "labs/alert/**"
      - "challenges/integrated/alert/**"
      - "scripts/generate_alert_release.py"
      - ".github/workflows/alert.yml"
      - ".github/workflows/alert-release.yml"
  push:
    branches: [main]
    paths:
      - "labs/alert/**"
      - "challenges/integrated/alert/**"
      - "scripts/generate_alert_release.py"
      - ".github/workflows/alert.yml"
      - ".github/workflows/alert-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Generate or reuse a CI Flag and create a second distinct instance Flag
        id: flags
        env:
          RELEASE_VERSION: 0.0.0-ci.${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_alert_release.py --version "$RELEASE_VERSION"
          manifest="labs/alert/flags/releases/$RELEASE_VERSION.json"
          before=$(sha256sum "$manifest" | cut -d' ' -f1)
          python3 scripts/generate_alert_release.py --version "$RELEASE_VERSION"
          after=$(sha256sum "$manifest" | cut -d' ' -f1)
          test "$before" = "$after"
          python3 - <<'PY'
          import json, os, pathlib, re, base64, secrets
          version = os.environ["RELEASE_VERSION"]
          manifest = json.loads(pathlib.Path(f"labs/alert/flags/releases/{version}.json").read_text())
          flag_a = manifest["flag"]
          flag_b = "TTP{" + base64.b32encode(secrets.token_bytes(10)).decode().rstrip("=").lower() + "}"
          while flag_b == flag_a:
              flag_b = "TTP{" + base64.b32encode(secrets.token_bytes(10)).decode().rstrip("=").lower() + "}"
          assert re.fullmatch(r"TTP\{[a-z2-7]{16}\}", flag_a)
          assert pathlib.Path("labs/alert/flags/user.txt").read_text().strip() == flag_a
          challenge = pathlib.Path("challenges/integrated/alert/Blind-Review.md").read_text()
          assert challenge.count(f'answer: "{flag_a}"') == 1
          assert challenge.count("kind: flag") == 1 and "lab: alert" in challenge
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"flag_a={flag_a}\n")
              output.write(f"flag_b={flag_b}\n")
          print(f"::add-mask::{flag_a}")
          print(f"::add-mask::{flag_b}")
          print("Alert release Flag matches Challenge; second instance Flag is distinct: PASS")
          PY

      - name: Syntax-check browser player and Flag generator
        run: python3 -m py_compile labs/alert/tests/browser_proof.py scripts/generate_alert_release.py

      - name: Build genuine PHP, Markdown and Chromium target
        run: docker build --pull --progress=plain -t ttp-alert:e2e -f labs/alert/Dockerfile labs/alert

      - name: Pull independent HTTP attacker image
        run: docker pull python:3.12-alpine

      - name: Create internal-only acceptance network
        run: docker network create --internal alert-acceptance

      - name: Run two clean target instances and prove exact per-instance Flag retrieval
        env:
          FLAG_A: ${{ steps.flags.outputs.flag_a }}
          FLAG_B: ${{ steps.flags.outputs.flag_b }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs alert-target 2>/dev/null || true
            docker rm -f alert-target 2>/dev/null || true
            docker network rm alert-acceptance 2>/dev/null || true
            docker image rm ttp-alert:e2e 2>/dev/null || true
          }
          trap cleanup EXIT

          run_instance() {
            local suffix="$1"
            local flag="$2"
            echo "Starting clean Alert instance $suffix"
            docker run -d \
              --name alert-target \
              --network alert-acceptance \
              --network-alias alert-target \
              --memory 1100m --cpus 2 --pids-limit 256 \
              --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges \
              -e ALERT_USER_FLAG="$flag" \
              ttp-alert:e2e >/dev/null

            local ready=0
            for attempt in $(seq 1 90); do
              local state health
              state=$(docker inspect -f '{{.State.Status}}' alert-target)
              health=$(docker inspect -f '{{.State.Health.Status}}' alert-target)
              if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
                docker logs alert-target
                echo "Alert instance failed before becoming healthy"
                return 1
              fi
              if [ "$health" = "healthy" ]; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then docker logs alert-target; return 1; fi

            docker run --rm \
              --network alert-acceptance \
              --network-alias attacker \
              -v "$GITHUB_WORKSPACE/labs/alert/tests/browser_proof.py:/browser_proof.py:ro" \
              -e TARGET_URL=http://alert-target:8080 \
              -e EXPECTED_FLAG="$flag" \
              python:3.12-alpine python /browser_proof.py

            docker stats --no-stream alert-target \
              --format "Instance $suffix memory={{.MemUsage}} pids={{.PIDs}}"
            docker rm -f alert-target >/dev/null
            echo "Alert instance $suffix: PASS"
          }

          run_instance a "$FLAG_A"
          run_instance b "$FLAG_B"
          test "$FLAG_A" != "$FLAG_B"
          docker image inspect ttp-alert:e2e --format 'IMAGE_SIZE_BYTES={{.Size}}'
          echo "PASS: two clean instances each returned their own exact random Web Flag; the release Challenge answer matches instance A." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture diagnostics
        if: always()
        run: |
          docker logs alert-target || true
          docker image inspect ttp-alert:e2e --format='IMAGE_SIZE_BYTES={{.Size}}' || true
          docker stats --no-stream alert-target || true

      - name: Clean up acceptance resources
        if: always()
        run: |
          docker rm -f alert-target 2>/dev/null || true
          docker network rm alert-acceptance 2>/dev/null || true
          docker image rm ttp-alert:e2e 2>/dev/null || true
