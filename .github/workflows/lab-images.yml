name: Build and publish lab images
# CI validates build/startup/health only. Full lab flow is reviewed manually.

on:
  pull_request:
    paths:
      - "labs/**"
      - ".github/workflows/lab-images.yml"
  push:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/lab-images.yml"
  workflow_dispatch:
    inputs:
      directory:
        description: "发布的靶机目录，例如 labs/bike"
        required: true
        type: string
      version:
        description: "版本号，例如 1.0.0；已发布的版本不能重复使用"
        required: true
        type: string

permissions:
  contents: read

# 在教材仓库中只需调整镜像根目录。目录内每个 Dockerfile 对应一台靶机。
env:
  IMAGE_ROOT: labs

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SELECTED_DIRECTORY: ${{ inputs.directory }}
          RELEASE_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          repo = Path.cwd().resolve()
          root = (repo / os.environ['IMAGE_ROOT']).resolve()
          root.relative_to(repo)
          if not root.is_dir():
              raise SystemExit('IMAGE_ROOT 目录不存在，请修改工作流中的 IMAGE_ROOT')
          selected = os.environ.get('SELECTED_DIRECTORY', '').strip()
          selected_path = (repo / selected).resolve() if selected else None
          if selected_path:
              selected_path.relative_to(root)
          owner = os.environ['GITHUB_REPOSITORY_OWNER'].lower()
          publishing = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          version = os.environ.get('RELEASE_VERSION', '').strip()
          # A lab may be merged for development but explicitly blocked from release.
          # Only manual GHCR publishing is gated; pull-request builds still run.
          if publishing and selected_path and (selected_path / ".release-blocked").is_file():
              raise SystemExit(f'{selected}: release blocked; see {selected}/.release-blocked')
          if publishing:
              if not selected:
                  raise SystemExit('发布时必须指定一个靶机目录')
              if len(version) > 32 or not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
                  raise SystemExit('版本号使用三段数字，例如 1.0.0，不含 v 前缀')
          items, slugs = [], set()
          for dockerfile in sorted(root.rglob('Dockerfile')):
              if dockerfile.is_symlink():
                  raise SystemExit('Dockerfile 必须为普通文件')
              directory = dockerfile.parent.resolve()
              directory.relative_to(root)
              relative = directory.relative_to(root).as_posix()
              slug = relative.replace('/', '-') if relative != '.' else root.name
              if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', slug) or len(slug) > 64:
                  raise SystemExit(f'{directory}: 靶机目录使用小写英文、数字和连字符，最多 64 字符')
              if slug in slugs:
                  raise SystemExit(f'靶机目录标识重复: {slug}')
              slugs.add(slug)
              if selected_path and directory != selected_path:
                  continue
              image = f'ghcr.io/{owner}/attackbox-labs:{slug}-v{version}' if publishing else f'attackbox-lab-check:{slug}'
              items.append({'context': directory.relative_to(repo).as_posix(), 'slug': slug,
                  'image': image, 'version': version if publishing else ''})
          if not items or len(items) > 256:
              raise SystemExit('需要 1–256 个靶机目录；请检查 IMAGE_ROOT 或手动指定 directory')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': items}) + '\n')
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: lab-image-${{ matrix.slug }}-${{ matrix.version || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check release version
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ matrix.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, json, os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          repository, tag = os.environ['IMAGE'].removeprefix('ghcr.io/').rsplit(':', 1)
          credentials = base64.b64encode((os.environ['REGISTRY_USER'] + ':' + os.environ['REGISTRY_TOKEN']).encode()).decode()
          query = urlencode({'service': 'ghcr.io', 'scope': f'repository:{repository}:pull,push'})
          request = Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + credentials})
          try:
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
              token = result.get('token') or result.get('access_token')
              if not isinstance(token, str) or not token:
                  raise SystemExit('GHCR 未返回有效凭据，停止发布')
              request = Request(f'https://ghcr.io/v2/{repository}/manifests/{tag}', method='HEAD', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'})
              try:
                  with urlopen(request, timeout=30):
                      pass
              except HTTPError as error:
                  if error.code == 404:
                      raise SystemExit(0)
                  raise
              raise SystemExit(f'版本 {tag} 已发布，请使用新版本号')
          except HTTPError as error:
              raise SystemExit(f'GHCR 版本检查失败（HTTP {error.code}），停止发布')
          except (OSError, ValueError):
              raise SystemExit('GHCR 版本检查失败，请检查网络或凭据，停止发布')
          PY
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
          cache-from: type=gha,scope=lab-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=lab-${{ matrix.slug }}
      - name: Check startup and health
        env:
          IMAGE: ${{ matrix.image }}
          LAB_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          # Keep all smoke-test containers disconnected from external networks.
          # Only the explicitly selected lab receives its required capability.
          args=(--network none)
          case "$LAB_SLUG" in
            trick)
              args+=(--cap-add NET_ADMIN
                -e TRICK_STATIC_USER_FLAG="TTP{ci_trick_user_not_production}"
                -e TRICK_STATIC_ROOT_FLAG="TTP{ci_trick_root_not_production}"
                -e TRICK_TARGET_IPV4="192.0.2.10")
              ;;
            union)
              args+=(--cap-add NET_ADMIN
                -e UNION_REQUIRE_PRIVATE_FLAGS=1
                -e UNION_STATIC_USER_FLAG="TTP{ci_union_user_not_production}"
                -e UNION_STATIC_ROOT_FLAG="TTP{ci_union_root_not_production}")
              ;;
            usage)
              args+=(-e USAGE_REQUIRE_PRIVATE_FLAGS=1
                -e USAGE_STATIC_USER_FLAG="TTP{ci_usage_user_not_production}"
                -e USAGE_STATIC_ROOT_FLAG="TTP{ci_usage_root_not_production}")
              ;;
            validation)
              args+=(-e VALIDATION_REQUIRE_PRIVATE_FLAGS=1
                -e VALIDATION_STATIC_USER_FLAG="TTP{ci_validation_user_not_production}"
                -e VALIDATION_STATIC_ROOT_FLAG="TTP{ci_validation_root_not_production}")
              ;;
          esac
          test_container=$(docker run -d "${args[@]}" "$IMAGE")
          cleanup() { docker logs "$test_container"; docker rm -f "$test_container"; }
          trap cleanup EXIT
          export TEST_CONTAINER="$test_container"
          python3 <<'PY'
          import json, os, subprocess, time
          started = time.monotonic()
          while time.monotonic() - started < 120:
              state = json.loads(subprocess.check_output(['docker', 'inspect', os.environ['TEST_CONTAINER']]))[0]['State']
              if state['Status'] in ('exited', 'dead', 'removing'):
                  raise SystemExit('靶机进程提前退出')
              health = state.get('Health', {}).get('Status')
              if health == 'unhealthy':
                  raise SystemExit('Docker HEALTHCHECK 失败')
              if state['Status'] == 'running' and (health == 'healthy' or (not health and time.monotonic() - started >= 5)):
                  break
              time.sleep(1)
          else:
              raise SystemExit('靶机启动检查超时')
          PY
      - name: Publish tested image
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker push "$IMAGE"
          printf '### 镜像已发布\n\n`%s`\n\n复制镜像地址到 AttackBox 后台登记。\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
