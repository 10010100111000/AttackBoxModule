name: Bashed original phpbash and root cron lab

on:
  push:
    branches: ["test/nibbles-authentic-small"]
    paths:
      - "labs/bashed/**"
      - ".github/workflows/bashed.yml"
  pull_request:
    paths:
      - "labs/bashed/**"
      - ".github/workflows/bashed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bashed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build real Arrexel/phpbash on Apache/PHP and root cron
        run: docker build --progress=plain -f labs/bashed/Dockerfile -t ttp-bashed:ci labs/bashed
      - name: Measure target image
        run: |
          set -euo pipefail
          bytes=$(docker image inspect -f '{{.Size}}' ttp-bashed:ci)
          awk -v b="$bytes" 'BEGIN {printf "Bashed image: %.1f MiB (%d bytes)\n",b/1048576,b}'
          echo "Bashed image bytes: $bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Real independent webshell -> sudo user -> root cron -> reset
        run: |
          set -euo pipefail
          net=bashed-ci
          target=bashed-target
          cleanup() {
            docker inspect --format '{{range .State.Health.Log}}{{println .ExitCode}}{{println .Output}}{{end}}' "$target" || true
            docker exec "$target" bash -x /usr/local/bin/bashed-healthcheck || true
            docker logs --tail 120 "$target" || true
            docker exec "$target" sh -c 'date; ps aux; cat /etc/cron.d/root-scripts; ls -la /scripts; cat /scripts/test.py; stat /scripts/test.txt; cat /tmp/bashed-cron-runs 2>/dev/null' || true
            docker rm -f "$target" bashed-other >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          docker network create --internal "$net"
          trap cleanup EXIT
          start_target() {
            docker run -d --name "$target" --network "$net" \
              --memory 256m --pids-limit 128 --cpus 1 \
              -e BASHED_REQUIRE_PRIVATE_FLAGS=1 \
              -e BASHED_STATIC_USER_FLAG='TTP{bashed_ci_private_user_0123456789}' \
              -e BASHED_STATIC_ROOT_FLAG='TTP{bashed_ci_private_root_0123456789}' \
              ttp-bashed:ci
          }
          wait_healthy() {
            for i in $(seq 1 60); do
              state=$(docker inspect -f '{{.State.Status}}' "$target")
              if [ "$state" != running ]; then docker logs "$target"; return 1; fi
              health=$(docker inspect -f '{{.State.Health.Status}}' "$target")
              if [ "$health" = healthy ]; then return 0; fi
              if [ "$health" = unhealthy ]; then docker logs "$target"; return 1; fi
              sleep 2
            done
            docker logs "$target"; return 1
          }
          start_target
          wait_healthy
          docker run --rm --network "$net" \
            -v "$PWD/labs/bashed/tests:/tests:ro" \
            python:3.12-alpine python /tests/attack_path.py
          docker exec "$target" sh -c \
            'test "$(cat /root/root.txt)" = "TTP{bashed_ci_private_root_0123456789}"; test -s /tmp/bashed-root-proof'
          docker stats --no-stream --format 'Target memory: {{.MemUsage}}, PIDs: {{.PIDs}}' "$target"
          docker run -d --name bashed-other --network "$net" --memory 256m --pids-limit 128 --cpus 1 \
            -e BASHED_REQUIRE_PRIVATE_FLAGS=1 \
            -e BASHED_STATIC_USER_FLAG='TTP{bashed_other_user_0123456789}' \
            -e BASHED_STATIC_ROOT_FLAG='TTP{bashed_other_root_0123456789}' ttp-bashed:ci
          docker exec bashed-other sh -c \
            'test "$(cat /home/arrexel/user.txt)" = "TTP{bashed_other_user_0123456789}"; test ! -e /tmp/bashed-root-proof'
          docker rm -f "$target"
          start_target
          wait_healthy
          docker run --rm --network "$net" \
            -v "$PWD/labs/bashed/tests:/tests:ro" \
            python:3.12-alpine python /tests/reset_path.py
          docker exec "$target" sh -c \
            'test ! -e /tmp/bashed-root-proof; grep -Fq "f.write(\\"testing 123!\\")" /scripts/test.py'
          echo 'PASS: genuine phpbash + native sudo + real one-minute root cron + static flags + isolated reset'
