name: Zipping authentic Web full-chain CI

on:
  pull_request:
    paths:
      - "labs/zipping/**"
      - ".github/workflows/zipping.yml"
      - "catalog/web-curriculum.json"
  push:
    branches: [main]
    paths:
      - "labs/zipping/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zipping-web-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build single-container real Apache PHP MariaDB 7z target
        run: docker build --progress=plain -t ttp-zipping:ci -f labs/zipping/Dockerfile labs/zipping
      - name: Build independent HTTP attacker
        run: docker build -t ttp-zipping-attacker:ci -f labs/zipping/tests/Dockerfile.attacker labs/zipping/tests
      - name: Verify two fresh instances through real HTTP exploit sequence
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect ttp-zipping:ci --format 'Target image bytes: {{.Size}}'
          docker network create --internal zipping-ci
          cleanup() {
            docker logs zipping-target 2>/dev/null || true
            docker rm -f zipping-target >/dev/null 2>&1 || true
            docker network rm zipping-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for suffix in alpha beta; do
            if [ "$suffix" = alpha ]; then
              flag='TTP{zipping_alpha_web_flag}'
            else
              flag='TTP{zipping_beta_web_flag}'
            fi
            docker run -d --name zipping-target \
              --network zipping-ci --network-alias zipping-target \
              --security-opt no-new-privileges \
              --memory 1g --cpus 1.5 --pids-limit 240 \
              -e "ZIPPING_USER_FLAG=$flag" ttp-zipping:ci
            ready=0
            for n in $(seq 1 120); do
              state=$(docker inspect -f '{{.State.Status}}' zipping-target)
              health=$(docker inspect -f '{{.State.Health.Status}}' zipping-target)
              if [ "$state" != running ] || [ "$health" = unhealthy ]; then
                docker logs zipping-target
                exit 1
              fi
              if [ "$health" = healthy ]; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1
            test "$(docker inspect -f '{{.HostConfig.Privileged}}' zipping-target)" = false
            test "$(docker inspect -f '{{len .HostConfig.CapAdd}}' zipping-target)" = 0
            test "$(docker inspect -f '{{len .Mounts}}' zipping-target)" = 0
            if ! docker run --rm --network zipping-ci \
              -e TARGET_URL=http://zipping-target:8080 \
              -e "EXPECTED_USER_FLAG=$flag" \
              ttp-zipping-attacker:ci; then
              echo 'Diagnostic only: Apache errors and extracted ZIP entries' >&2
              docker exec zipping-target sh -c 'tail -n 30 /var/log/apache2/error.log; ls -la /tmp/zipping-* 2>/dev/null || true' || true
              exit 1
            fi
            docker stats --no-stream --format 'Target memory: {{.MemUsage}}; PIDs: {{.PIDs}}' zipping-target
            docker rm -f zipping-target
          done
          echo 'PASS: two independent Zipping Web-chain instances'
