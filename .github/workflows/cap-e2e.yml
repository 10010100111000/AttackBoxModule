name: Cap single-instance IDOR PCAP and Python capability E2E

on:
  pull_request:
    paths:
      - "labs/cap/**"
      - "challenges/idor/cap-packet-drop/**"
      - "challenges/linux-privilege-escalation/cap-setuid/**"
      - ".github/workflows/cap-e2e.yml"
  push:
    branches: [main]
    paths:
      - "labs/cap/**"
      - "challenges/idor/cap-packet-drop/**"
      - "challenges/linux-privilege-escalation/cap-setuid/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  cap-full-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check Challenge answers and release manifest consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          user = Path("labs/cap/flags/user.txt").read_text().strip()
          root = Path("labs/cap/flags/root.txt").read_text().strip()
          manifest = json.loads(Path("labs/cap/flags/releases/0.1.0.json").read_text())
          assert manifest["flags"] == {"user": user, "root": root}
          packet = Path("challenges/idor/cap-packet-drop/Packet-Drop.md").read_text()
          full = Path("challenges/linux-privilege-escalation/cap-setuid/Setuid-Surprise.md").read_text()
          assert f'answer: "{user}"' in packet
          assert full.count(f'answer: "{user}"') == 1
          assert full.count(f'answer: "{root}"') == 1
          assert "lab: cap" in packet and "lab: cap" in full
          print("PASS: versioned release manifest, target seeds and both Challenge answers agree")
          PY
          python3 -m py_compile labs/cap/tests/attack_path.py

      - name: Build Cap target image
        run: docker build --pull --progress=plain -t ttp-cap:ci -f labs/cap/Dockerfile labs/cap

      - name: Build separate non-root HTTP FTP SSH attacker
        run: docker build --pull --progress=plain -t ttp-cap-attacker:ci -f labs/cap/tests/Dockerfile.ssh-attacker labs/cap/tests

      - name: Generate one instance's User and Root Flags
        id: flags
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, secrets, os
          def make_flag():
              token = base64.b32encode(secrets.token_bytes(10)).decode().rstrip("=").lower()
              return "TTP{" + token + "}"
          user, root = make_flag(), make_flag()
          while user == root:
              root = make_flag()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in (("user", user), ("root", root)):
                  print("::add-mask::" + value)
                  output.write(name + "=" + value + "\n")
          print("Generated one instance's distinct 80-bit User and Root Flags; values are masked.")
          PY

      - name: Run complete IDOR to Python capability path on one instance
        env:
          USER_FLAG: \${{ steps.flags.outputs.user }}
          ROOT_FLAG: \${{ steps.flags.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs cap-target 2>/dev/null || true
            docker rm -f cap-target 2>/dev/null || true
            docker network rm cap-e2e 2>/dev/null || true
          }
          trap cleanup EXIT
          docker network create --internal cap-e2e

          docker run -d \
            --name cap-target \
            --network cap-e2e \
            --network-alias cap-target \
            --memory 128m --cpus 1 --pids-limit 128 \
            -e CAP_REQUIRE_PRIVATE_FLAGS=1 \
            -e CAP_STATIC_USER_FLAG="$USER_FLAG" \
            -e CAP_STATIC_ROOT_FLAG="$ROOT_FLAG" \
            ttp-cap:ci >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}' cap-target)
            health=$(docker inspect -f '{{.State.Health.Status}}' cap-target)
            if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
              docker logs cap-target
              echo "Cap failed before becoming healthy"
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1

          docker run --rm \
            --network cap-e2e \
            -e TARGET_URL=http://cap-target \
            -e CAP_EXPECTED_USER_FLAG="$USER_FLAG" \
            -e CAP_EXPECTED_ROOT_FLAG="$ROOT_FLAG" \
            ttp-cap-attacker:ci

          docker stats --no-stream cap-target --format "Cap memory={{.MemUsage}} pids={{.PIDs}}"
          echo "PASS: one fresh instance completed IDOR, PCAP, FTP/SSH reuse and Python cap_setuid Root"

      - name: Record target image size
        if: always()
        run: docker image inspect ttp-cap:ci --format='IMAGE_SIZE_BYTES={{.Size}}' || true
