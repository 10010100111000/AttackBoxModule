name: Soccer authentic WebSocket SQL injection CI
on:
  pull_request:
    paths:
      - "labs/soccer/**"
      - ".github/workflows/soccer.yml"
      - "catalog/web-curriculum.json"
  push:
    branches: [main]
    paths:
      - "labs/soccer/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soccer-web-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build genuine file manager with real MariaDB and WebSocket
        run: docker build --progress=plain -t ttp-soccer:ci -f labs/soccer/Dockerfile labs/soccer
      - name: Build independent network-only attacker
        run: docker build -t ttp-soccer-attacker:ci -f labs/soccer/tests/Dockerfile.attacker labs/soccer/tests
      - name: Full Web chain on two fresh isolated instances
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect ttp-soccer:ci --format 'Image bytes: {{.Size}}'
          docker network create --internal soccer-ci
          cleanup() {
            docker logs soccer-target 2>/dev/null || true
            docker rm -f soccer-target >/dev/null 2>&1 || true
            docker network rm soccer-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for suffix in alpha beta; do
            if [ "$suffix" = alpha ]; then flag='TTP{soccer_alpha_websocket_flag}'; else flag='TTP{soccer_beta_websocket_flag}'; fi
            docker run -d --name soccer-target \
              --network soccer-ci --network-alias soccer-target \
              --security-opt no-new-privileges \
              --memory 1024m --cpus 1.5 --pids-limit 220 \
              -e "SOCCER_USER_FLAG=$flag" ttp-soccer:ci
            ready=0
            for i in $(seq 1 120); do
              state=$(docker inspect -f '{{.State.Status}}' soccer-target)
              health=$(docker inspect -f '{{.State.Health.Status}}' soccer-target)
              if [ "$state" != running ] || [ "$health" = unhealthy ]; then docker logs soccer-target; exit 1; fi
              if [ "$health" = healthy ]; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1
            test "$(docker inspect -f '{{.HostConfig.Privileged}}' soccer-target)" = false
            test "$(docker inspect -f '{{len .HostConfig.CapAdd}}' soccer-target)" = 0
            test "$(docker inspect -f '{{len .Mounts}}' soccer-target)" = 0
            docker run --rm --network soccer-ci --cap-drop ALL \
              -e TARGET_URL=http://soccer-target:8080 \
              -e TARGET_WS=ws://soccer-target:9091 \
              -e "EXPECTED_USER_FLAG=$flag" ttp-soccer-attacker:ci
            docker stats --no-stream --format 'Memory: {{.MemUsage}}; PIDs: {{.PIDs}}' soccer-target
            docker rm -f soccer-target
          done
          echo 'PASS: two independently solved Soccer Web-only targets'
