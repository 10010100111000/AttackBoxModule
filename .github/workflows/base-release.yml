name: Base versioned User and Root Flag release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version; the same version reuses its User/Root Flag pair."
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: base-flag-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate or reuse versioned User and Root Flags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/generate_base_release.py --version "$RELEASE_VERSION"
          manifest="labs/base/flags/releases/$RELEASE_VERSION.json"
          before=$(sha256sum "$manifest" | cut -d' ' -f1)
          python3 scripts/generate_base_release.py --version "$RELEASE_VERSION"
          after=$(sha256sum "$manifest" | cut -d' ' -f1)
          test "$before" = "$after"
          echo "Base same-version Flag pair is deterministic: PASS"

      - name: Verify Manifest, target files and Challenge answers
        id: flags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          version = os.environ["RELEASE_VERSION"]
          manifest = json.loads(pathlib.Path(f"labs/base/flags/releases/{version}.json").read_text())
          user = pathlib.Path("labs/base/user_flag.txt").read_text().strip()
          root = pathlib.Path("labs/base/root_flag.txt").read_text().strip()
          challenge = pathlib.Path("challenges/startpoint/base/Base.md").read_text()
          answers = re.findall(r'(?m)^answer:\s*"([^"]+)"$', challenge)
          pattern = r"TTP\{[a-z2-7]{16}\}"
          assert manifest["version"] == version
          assert manifest["user_flag"] == user and manifest["root_flag"] == root
          assert re.fullmatch(pattern, user) and re.fullmatch(pattern, root) and user != root
          assert answers == [user, root]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"user={user}\nroot={root}\n")
          print(f"::add-mask::{user}")
          print(f"::add-mask::{root}")
          print("Base release Flag consistency: PASS")
          PY

      - name: Build target and attacker images
        run: |
          docker build --pull --progress=plain -t ttp-base:release -f labs/base/Dockerfile labs/base
          docker build --pull --progress=plain -t ttp-base-attacker:release -f scripts/attackers/base/Dockerfile scripts/attackers/base

      - name: Start target and verify both Flags through the real chain
        env:
          EXPECTED_USER_FLAG: ${{ steps.flags.outputs.user }}
          EXPECTED_ROOT_FLAG: ${{ steps.flags.outputs.root }}
        run: |
          set -euo pipefail
          docker network create --internal base-release
          cleanup() {
            docker logs base-target 2>/dev/null || true
            docker rm -f base-target 2>/dev/null || true
            docker network rm base-release 2>/dev/null || true
            docker image rm ttp-base:release ttp-base-attacker:release 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run -d --name base-target --network base-release --network-alias base-target \
            --memory 500m --cpus 2 --pids-limit 160 ttp-base:release
          ready=0
          for attempt in $(seq 1 45); do
            state=$(docker inspect -f '{{.State.Status}}' base-target)
            health=$(docker inspect -f '{{.State.Health.Status}}' base-target)
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then docker logs base-target; exit 1; fi
            if [ "$health" = healthy ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker run --rm --network base-release \
            -v "$GITHUB_WORKSPACE/labs/base/exploit.py:/exploit.py:ro" \
            -e EXPECTED_USER_FLAG -e EXPECTED_ROOT_FLAG \
            ttp-base-attacker:release python /exploit.py \
              --url http://base-target --ssh-host base-target \
              --expected-user-flag "$EXPECTED_USER_FLAG" \
              --expected-root-flag "$EXPECTED_ROOT_FLAG"

      - name: Commit verified release artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "labs/base/flags/releases/$RELEASE_VERSION.json" labs/base/user_flag.txt labs/base/root_flag.txt challenges/startpoint/base/Base.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(base): generate User and Root Flags for $RELEASE_VERSION"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Summarize
        run: |
          echo "A versioned User/Root Flag pair was generated, deployed, retrieved through the actual PHP/SSH/sudo chain and compared exactly before release commit." >> "$GITHUB_STEP_SUMMARY"
