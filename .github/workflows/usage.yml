name: Usage blind SQLi and full privilege-chain CI

on:
  pull_request:
    paths:
      - "labs/usage/**"
      - ".github/workflows/usage.yml"
      - "catalog/web-curriculum.json"
  push:
    branches: [main]
    paths:
      - "labs/usage/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage-full-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the single-container Usage target
        run: docker build --progress=plain -t ttp-usage:ci -f labs/usage/Dockerfile labs/usage
      - name: Build independent player/AttackBox verifier
        run: docker build --progress=plain -t ttp-usage-attacker:ci -f labs/usage/tests/Dockerfile.attacker labs/usage/tests
      - name: Measure target image and run two isolated player instances
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect ttp-usage:ci --format 'Target image bytes: {{.Size}}'
          network=usage-ci
          target=usage-target
          cleanup() {
            docker logs "$target" 2>/dev/null || true
            docker rm -f "$target" 2>/dev/null || true
            docker network rm "$network" 2>/dev/null || true
          }
          docker network create --internal "$network"
          trap cleanup EXIT

          run_target() {
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker run -d --name "$target" --network "$network" \
              --network-alias usage.htb --network-alias admin.usage.htb \
              --memory 768m --cpus 1 --pids-limit 256 \
              -e USAGE_REQUIRE_PRIVATE_FLAGS=1 \
              -e USAGE_STATIC_USER_FLAG="$1" \
              -e USAGE_STATIC_ROOT_FLAG="$2" \
              ttp-usage:ci
          }

          wait_healthy() {
            for n in $(seq 1 240); do
              state=$(docker inspect -f '{{.State.Status}}' "$target")
              if [ "$state" != running ]; then
                echo "Target exited before healthcheck" >&2
                docker logs "$target" || true
                return 1
              fi
              health=$(docker inspect -f '{{.State.Health.Status}}' "$target")
              if [ "$health" = healthy ]; then return 0; fi
              if [ "$health" = unhealthy ]; then
                docker logs "$target" || true
                return 1
              fi
              sleep 2
            done
            docker logs "$target" || true
            echo "Target healthcheck timed out" >&2
            return 1
          }

          run_player() {
            docker run --rm --network "$network" --memory 256m --cpus 1 \
              -e EXPECTED_USER_FLAG="$1" -e EXPECTED_ROOT_FLAG="$2" \
              ttp-usage-attacker:ci
          }

          run_target 'TTP{usage_user_instance_one}' 'TTP{usage_root_instance_one}'
          wait_healthy
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' "$target")" = "false"
          test "$(docker inspect -f '{{len .Mounts}}' "$target")" = "0"
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$target")" = "$network"
          run_player 'TTP{usage_user_instance_one}' 'TTP{usage_root_instance_one}'
          docker stats --no-stream --format 'Instance one memory: {{.MemUsage}}; PIDs: {{.PIDs}}' "$target"
          docker rm -f "$target"

          run_target 'TTP{usage_user_instance_two}' 'TTP{usage_root_instance_two}'
          wait_healthy
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' "$target")" = "false"
          test "$(docker inspect -f '{{len .Mounts}}' "$target")" = "0"
          run_player 'TTP{usage_user_instance_two}' 'TTP{usage_root_instance_two}'
          docker stats --no-stream --format 'Instance two memory: {{.MemUsage}}; PIDs: {{.PIDs}}' "$target"
          echo 'PASS: two fresh instances independently complete boolean/time SQLi, real Laravel-admin upload, dash SSH, Monit credential reuse, xander sudo 7za and distinct Flags'
