name: Shocker original Bash 4.3 lightweight lab

on:
  push:
    branches: ["test/nibbles-authentic-small"]
    paths:
      - "labs/shocker/**"
      - ".github/workflows/shocker.yml"
  pull_request:
    paths:
      - "labs/shocker/**"
      - ".github/workflows/shocker.yml"
  workflow_dispatch:

concurrency:
  group: shocker-original-small
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shocker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build authentic unpatched GNU Bash 4.3 and real Apache CGI
        run: docker build --progress=plain -f labs/shocker/Dockerfile -t ttp-shocker:ci labs/shocker
      - name: Validate small artifact footprint
        run: |
          set -euo pipefail
          bytes=$(docker image inspect -f '{{.Size}}' ttp-shocker:ci)
          awk -v b="$bytes" 'BEGIN {printf "Shocker image: %.1f MiB (%d bytes)\n", b/1048576,b}'
          test "$bytes" -le $((90 * 1048576))
      - name: Real CGI Shellshock, native sudo Perl and Worker-style reset
        run: |
          set -euo pipefail
          net=shocker-ci-network
          target=shocker-target
          docker network create --internal "$net"
          cleanup() {
            docker logs --tail 130 "$target" || true
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          start_target() {
            docker run -d --name "$target" --network "$net" --memory 96m \
              --pids-limit 96 --cpus 1 \
              -e SHOCKER_REQUIRE_PRIVATE_FLAGS=1 \
              -e SHOCKER_STATIC_USER_FLAG='TTP{shocker_ci_private_user_0123456789}' \
              -e SHOCKER_STATIC_ROOT_FLAG='TTP{shocker_ci_private_root_0123456789}' \
              ttp-shocker:ci
          }
          diagnostics() {
            echo '--- container / Apache CGI diagnostics ---' >&2
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$target" >&2 || true
            docker inspect -f '{{range .State.Health.Log}}{{.ExitCode}}: {{.Output}}{{end}}' "$target" >&2 || true
            docker exec "$target" sh -c 'wget -S -T 3 -O - http://127.0.0.1/cgi-bin/user.sh' >&2 || true
            docker exec "$target" sh -c 'httpd -t; grep -in ScriptAlias /etc/apache2/httpd.conf /etc/apache2/conf.d/shocker-cgi.conf' >&2 || true
            docker logs --tail 100 "$target" >&2 || true
          }
          wait_healthy() {
            for i in $(seq 1 60); do
              state=$(docker inspect -f '{{.State.Status}}' "$target")
              if [ "$state" != running ]; then
                diagnostics; return 1
              fi
              health=$(docker inspect -f '{{.State.Health.Status}}' "$target")
              if [ "$health" = healthy ]; then return 0; fi
              if [ "$health" = unhealthy ]; then
                docker logs "$target"; return 1
              fi
              sleep 2
            done
            docker logs "$target"; return 1
          }
          start_target
          wait_healthy
          docker run --rm --network "$net" \
            -e TARGET_URL=http://shocker-target \
            -v "$PWD/labs/shocker/tests:/tests:ro" \
            python:3.12-alpine python /tests/attack_path.py
          docker exec -u shelly "$target" sh -c \
            'test -r /home/shelly/user.txt && test ! -r /root/root.txt && grep -q "uid=1001(shelly)" /tmp/shocker-native-shellshock-marker'
          docker exec -i -u shelly "$target" sh /dev/stdin \
            < labs/shocker/tests/native_root.sh
          docker exec "$target" sh -c \
            'test "$(cat /root/root.txt)" = "TTP{shocker_ci_private_root_0123456789}"'
          docker stats --no-stream --format 'Target memory: {{.MemUsage}}, PIDs: {{.PIDs}}' "$target"
          docker rm -f "$target"
          start_target
          wait_healthy
          docker run --rm --network "$net" \
            -e TARGET_URL=http://shocker-target \
            -v "$PWD/labs/shocker/tests:/tests:ro" \
            python:3.12-alpine python /tests/reset_path.py
          docker exec "$target" sh -c 'test ! -e /tmp/shocker-native-shellshock-marker'
          echo 'PASS: native GNU Bash 4.3 Shellshock + sudo Perl + private flags + reset'
