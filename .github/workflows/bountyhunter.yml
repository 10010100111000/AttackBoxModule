name: BountyHunter standalone Docker verification

on:
  push:
    branches: ["test/nibbles-authentic-small"]
    paths:
      - "labs/bountyhunter/**"
      - ".github/workflows/bountyhunter.yml"
  pull_request:
    paths:
      - "labs/bountyhunter/**"
      - ".github/workflows/bountyhunter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  bountyhunter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build Apache PHP and SSH target
        run: docker build --progress=plain -f labs/bountyhunter/Dockerfile -t ttp-bountyhunter:ci labs/bountyhunter
      - name: Measure image size
        run: |
          set -euo pipefail
          bytes=$(docker image inspect -f '{{.Size}}' ttp-bountyhunter:ci)
          awk -v b="$bytes" 'BEGIN {printf "BountyHunter image: %.1f MiB (%d bytes)\n",b/1048576,b}'
          test "$bytes" -le $((140 * 1048576))
      - name: Build independent HTTP test client
        run: docker build --progress=plain -f labs/bountyhunter/tests/Dockerfile.attacker -t ttp-bountyhunter-attacker:ci labs/bountyhunter/tests
      - name: Verify real service health and private instance reset
        run: |
          set -euo pipefail
          net=bountyhunter-ci
          target=bountyhunter-target
          docker network create --internal "$net"
          cleanup() {
            docker inspect --format '{{range .State.Health.Log}}{{println .ExitCode}}{{println .Output}}{{end}}' "$target" || true
            docker logs --tail 120 "$target" || true
            docker rm -f "$target" >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          start_target() {
            docker run -d --name "$target" --network "$net" \
              --memory 192m --pids-limit 128 --cpus 1 \
              -e BOUNTYHUNTER_REQUIRE_PRIVATE_FLAGS=1 \
              -e BOUNTYHUNTER_STATIC_USER_FLAG='TTP{bountyhunter_ci_user_0123456789}' \
              -e BOUNTYHUNTER_STATIC_ROOT_FLAG='TTP{bountyhunter_ci_root_0123456789}' \
              ttp-bountyhunter:ci
          }
          wait_healthy() {
            for i in $(seq 1 65); do
              state=$(docker inspect -f '{{.State.Status}}' "$target")
              if [ "$state" != running ]; then docker logs "$target"; return 1; fi
              health=$(docker inspect -f '{{.State.Health.Status}}' "$target")
              if [ "$health" = healthy ]; then return 0; fi
              if [ "$health" = unhealthy ]; then docker logs "$target"; return 1; fi
              sleep 2
            done
            docker logs "$target"; return 1
          }
          start_target
          wait_healthy
          test "$(docker inspect -f '{{.HostConfig.Privileged}}' "$target")" = false
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$target")" = "$net"
          docker run --rm --network "$net" \
            -v "$PWD/labs/bountyhunter/tests:/tests:ro" \
            ttp-bountyhunter-attacker:ci python3 /tests/smoke.py
          target_hostname=$(docker exec "$target" cat /etc/hostname)
          docker run --rm --network "$net" \
            -e EXPECTED_TARGET_HOSTNAME="$target_hostname" \
            -v "$PWD/labs/bountyhunter/tests:/tests:ro" \
            ttp-bountyhunter-attacker:ci python3 /tests/xml_file_probe.py
          docker run --rm --network "$net" \
            -e BOUNTY_TEST_PASSWORD='m19RoAU0hP41A1sTsq6K' \
            -v "$PWD/labs/bountyhunter/tests:/tests:ro" \
            ttp-bountyhunter-attacker:ci python3 /tests/ssh_auth.py
          docker exec "$target" sh -c \
            'test "$(cat /home/development/user.txt)" = "TTP{bountyhunter_ci_user_0123456789}"; test "$(cat /root/root.txt)" = "TTP{bountyhunter_ci_root_0123456789}"'
          docker stats --no-stream --format 'Target memory: {{.MemUsage}}, PIDs: {{.PIDs}}' "$target"
          docker rm -f "$target"
          start_target
          wait_healthy
          docker run --rm --network "$net" \
            -v "$PWD/labs/bountyhunter/tests:/tests:ro" \
            ttp-bountyhunter-attacker:ci python3 /tests/reset.py
          echo 'PASS: Apache PHP SimpleXML, SSH presence, private flags and fresh instance reset'
