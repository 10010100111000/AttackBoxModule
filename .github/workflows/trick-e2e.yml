name: Trick real DNS SQLi LFI SSH and Fail2ban E2E

on:
  pull_request:
    paths:
      - "labs/trick/**"
      - "challenges/integrated/trick/**"
      - "scripts/generate_trick_release.py"
      - ".github/workflows/trick-e2e.yml"
      - ".github/workflows/trick-release.yml"
  push:
    branches: [main]
    paths:
      - "labs/trick/**"
      - "challenges/integrated/trick/**"
      - "scripts/generate_trick_release.py"
      - ".github/workflows/trick-e2e.yml"
      - ".github/workflows/trick-release.yml"

permissions:
  contents: read

jobs:
  trick-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Generate a fresh random User and Root Flag pair
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/generate_trick_release.py --version "0.0.0-ci.$RUN_ID"

      - name: Verify Flag manifest and Challenge answers
        id: flags
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          manifest_path = next(pathlib.Path("labs/trick/flags/releases").glob("0.0.0-ci.*.json"))
          manifest = json.loads(manifest_path.read_text())
          challenge = pathlib.Path("challenges/integrated/trick/Trick.md").read_text()
          answers = re.findall(r'(?m)^answer:\s*"([^"]+)"$', challenge)
          user, root = manifest["user_flag"], manifest["root_flag"]
          pattern = r"TTP\{[a-z2-7]{16}\}"
          assert re.fullmatch(pattern, user) and re.fullmatch(pattern, root)
          assert user != root
          assert answers == [user, root]
          assert challenge.count("kind: flag") == 2 and "lab: trick" in challenge
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"user={user}\nroot={root}\n")
          print(f"::add-mask::{user}")
          print(f"::add-mask::{root}")
          print("Trick random User/Root Flag manifest and Challenge answers: PASS")
          PY

      - name: Syntax-check generator and attacker
        run: python3 -m py_compile scripts/generate_trick_release.py labs/trick/tests/acceptance.py

      - name: Build real Trick target
        run: docker build --pull --progress=plain -t ttp-trick:e2e -f labs/trick/Dockerfile labs/trick

      - name: Build independent DNS/HTTP/SSH attacker
        run: docker build --pull --progress=plain -t ttp-trick-attacker:e2e -f labs/trick/tests/Dockerfile.attacker labs/trick/tests

      - name: Start target on isolated network with only its own NET_ADMIN capability
        env:
          USER_FLAG: ${{ steps.flags.outputs.user }}
          ROOT_FLAG: ${{ steps.flags.outputs.root }}
        run: |
          set -euo pipefail
          docker network create --internal trick-e2e
          docker run -d --name trick-target --network trick-e2e --network-alias trick-target \
            --cap-add NET_ADMIN --memory 512m --cpus 2 --pids-limit 256 \
            -e TRICK_STATIC_USER_FLAG="$USER_FLAG" \
            -e TRICK_STATIC_ROOT_FLAG="$ROOT_FLAG" \
            ttp-trick:e2e
          ready=0
          for attempt in $(seq 1 90); do
            state=$(docker inspect -f '{{.State.Status}}' trick-target)
            health=$(docker inspect -f '{{.State.Health.Status}}' trick-target)
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then
              docker logs trick-target
              exit 1
            fi
            if [ "$health" = healthy ]; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          docker image inspect ttp-trick:e2e --format 'TARGET_IMAGE_SIZE_BYTES={{.Size}}'
          docker stats --no-stream trick-target

      - name: Run independent attacker through DNS, SQLi, LFI, SSH and Fail2ban
        env:
          EXPECTED_USER_FLAG: ${{ steps.flags.outputs.user }}
          EXPECTED_ROOT_FLAG: ${{ steps.flags.outputs.root }}
        run: |
          set -euo pipefail
          docker run --rm --network trick-e2e \
            -e TARGET=trick-target \
            -e EXPECTED_USER_FLAG="$EXPECTED_USER_FLAG" \
            -e EXPECTED_ROOT_FLAG="$EXPECTED_ROOT_FLAG" \
            ttp-trick-attacker:e2e

      - name: Record full-chain acceptance
        run: |
          echo "PASS: PTR/AXFR -> Payroll SQLi -> MariaDB LOAD_FILE -> Marketing nested PHP include -> michael SSH key -> SSH User Flag -> real Fail2ban root action -> Root Flag." >> "$GITHUB_STEP_SUMMARY"
          echo "Both Flags were retrieved through DNS/HTTP/SSH from an independent attacker on an internal Docker network. No target mount, Docker socket or docker exec was used." >> "$GITHUB_STEP_SUMMARY"
          echo "NET_ADMIN was granted only to the target container in its private network namespace." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture diagnostics
        if: always()
        run: |
          docker logs trick-target || true
          docker image inspect ttp-trick:e2e --format='TARGET_IMAGE_SIZE_BYTES={{.Size}}' || true
          docker stats --no-stream trick-target || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f trick-target 2>/dev/null || true
          docker network rm trick-e2e 2>/dev/null || true
          docker image rm ttp-trick:e2e ttp-trick-attacker:e2e 2>/dev/null || true
