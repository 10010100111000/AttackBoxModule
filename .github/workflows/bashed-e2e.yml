name: Bashed single-instance phpbash and root cron E2E

on:
  pull_request:
    paths:
      - "labs/bashed/**"
      - "challenges/startpoint/bashed/**"
      - "challenges/code-execution/bashed/**"
      - "challenges/linux-privilege-escalation/bashed/**"
      - ".github/workflows/bashed-e2e.yml"
  push:
    branches: [main]
    paths:
      - "labs/bashed/**"
      - "challenges/startpoint/bashed/**"
      - "challenges/code-execution/bashed/**"
      - "challenges/linux-privilege-escalation/bashed/**"
      - ".github/workflows/bashed-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bashed-full-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check integrated and focused Challenge answers
        run: |
          python3 -m py_compile labs/bashed/tests/attack_path.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          user = Path("labs/bashed/flags/user.txt").read_text().strip()
          root = Path("labs/bashed/flags/root.txt").read_text().strip()
          expected = {
              "challenges/startpoint/bashed/Bashed.md": [user, root],
              "challenges/code-execution/bashed/phpbash-webshell.md": [user],
              "challenges/linux-privilege-escalation/bashed/root-cron.md": [root],
          }
          for filename, answers_expected in expected.items():
              path = Path(filename)
              content = path.read_text()
              answers = re.findall(r'(?m)^answer: "([^"]+)"$', content)
              if answers != answers_expected:
                  raise SystemExit(f"Challenge answer mismatch: {filename}")
              if not re.search(r"(?m)^lab: bashed$", content):
                  raise SystemExit(f"Challenge does not reuse the Bashed Lab: {filename}")
          print("PASS: integrated and focused Challenges share one Lab and match its Flag seeds")
          PY

      - name: Build original phpbash target image
        run: docker build --pull --progress=plain -t ttp-bashed:ci -f labs/bashed/Dockerfile labs/bashed

      - name: Build separate non-root attacker
        run: docker build --pull --progress=plain -t ttp-bashed-attacker:ci -f labs/bashed/tests/Dockerfile.attacker labs/bashed/tests

      - name: Generate one instance's User and Root Flags
        id: flags
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, secrets, os
          def make_flag():
              token = base64.b32encode(secrets.token_bytes(10)).decode().rstrip("=").lower()
              return "TTP{" + token + "}"
          user, root = make_flag(), make_flag()
          while user == root:
              root = make_flag()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in (("user", user), ("root", root)):
                  print("::add-mask::" + value)
                  output.write(name + "=" + value + "\n")
          print("Generated one instance's distinct 80-bit User and Root Flags; values are masked.")
          PY

      - name: Run phpbash to real root-cron path on one clean instance
        env:
          USER_FLAG: ${{ steps.flags.outputs.user }}
          ROOT_FLAG: ${{ steps.flags.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs bashed-target 2>/dev/null || true
            docker rm -f bashed-target 2>/dev/null || true
            docker network rm bashed-e2e 2>/dev/null || true
          }
          trap cleanup EXIT
          docker network create --internal bashed-e2e

          docker run -d \
            --name bashed-target \
            --network bashed-e2e \
            --network-alias bashed-target \
            --memory 256m --cpus 1 --pids-limit 192 \
            -e BASHED_REQUIRE_PRIVATE_FLAGS=1 \
            -e BASHED_STATIC_USER_FLAG="$USER_FLAG" \
            -e BASHED_STATIC_ROOT_FLAG="$ROOT_FLAG" \
            ttp-bashed:ci >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}' bashed-target)
            health=$(docker inspect -f '{{.State.Health.Status}}' bashed-target)
            if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
              docker logs bashed-target
              echo "Bashed failed before becoming healthy"
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1

          docker run --rm \
            --network bashed-e2e \
            -e TARGET_URL=http://bashed-target \
            -e EXPECTED_USER_FLAG="$USER_FLAG" \
            -e EXPECTED_ROOT_FLAG="$ROOT_FLAG" \
            ttp-bashed-attacker:ci

          docker stats --no-stream bashed-target --format "Bashed memory={{.MemUsage}} pids={{.PIDs}}"
          echo "PASS: one fresh instance completed phpbash, User Flag and real root cron Root Flag"

      - name: Record target image size
        if: always()
        run: docker image inspect ttp-bashed:ci --format='IMAGE_SIZE_BYTES={{.Size}}' || true
