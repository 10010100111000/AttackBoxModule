name: Test Debian-only Pebbles historical dependencies

on:
  pull_request:
    paths:
      - 'labs/pebbles/Dockerfile.debian-probe'
      - 'labs/pebbles/debian/**'
      - '.github/workflows/pebbles-debian-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  dependency-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian Jessie historical package probe
        run: |
          set -euo pipefail
          docker build --progress=plain -f labs/pebbles/Dockerfile.debian-probe -t pebbles-debian-probe:ci labs/pebbles
      - name: Verify software versions and original sources
        run: |
          docker run --rm --network none --entrypoint /bin/sh pebbles-debian-probe:ci -ec '
            cat /etc/debian_version
            dpkg-query -W zoneminder mysql-community-server
            test -f /usr/share/zoneminder/www/ajax/log.php
            mysql --version
            php --version
          '

      - name: Build complete Debian Pebbles candidate (still experimental)
        run: |
          set -euo pipefail
          docker build --progress=plain -f labs/pebbles/Dockerfile.debian -t pebbles-debian:ci labs/pebbles

      - name: Probe native original services and Debian package versions
        run: |
          set -euo pipefail
          c=$(docker run -d --network none --memory 1536m --pids-limit 512 pebbles-debian:ci)
          cleanup() {
            docker logs --tail 120 "$c" || true
            docker rm -f "$c" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          status=starting
          for i in $(seq 1 70); do
            if [ "$i" = 20 ]; then
              echo '=== Debian service health diagnostic (not bypassed) ==='
              docker exec "$c" bash -x /usr/local/bin/pebbles-healthcheck 2>&1 | tail -70 || true
              echo '=== Live listeners / Apache / ZoneMinder ==='
              docker exec "$c" sh -c 'netstat -tlnp 2>/dev/null || true; ls -l /etc/apache2/conf-enabled/; php -v | head -1' || true
              echo '=== End Debian diagnostic ==='
            fi
            state=$(docker inspect -f '{{.State.Status}}' "$c")
            if [ "$state" != running ]; then
              echo "FAIL: container exited with status $state"
              docker inspect -f 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$c"
              exit 1
            fi
            status=$(docker inspect -f '{{.State.Health.Status}}' "$c")
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then echo 'FAIL: healthcheck unhealthy'; exit 1; fi
            sleep 2
          done
          test "$status" = healthy
          docker exec "$c" bash /usr/local/bin/pebbles-healthcheck
          docker cp labs/pebbles/debian/source-contract.sh "$c":/tmp/debian-source-contract.sh
          docker exec "$c" bash /tmp/debian-source-contract.sh
          docker exec "$c" curl -fsS http://127.0.0.1:3305/zm/index.php | grep -q ZoneMinder
          docker image inspect -f 'Debian candidate image size: {{.Size}} bytes' pebbles-debian:ci
