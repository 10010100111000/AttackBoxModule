name: Bike versioned Flag release

on:
  push:
    branches: [main]
    paths:
      - "labs/bike/flags/**"
      - "challenges/startpoint/bike/Bike.md"
      - "scripts/generate_bike_release.py"
      - ".github/workflows/bike-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Bike release version. Re-running the same version reuses its Flag."
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: bike-flag-release-${{ github.event.inputs.version || '0.1.0' }}
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate or reuse versioned random Flag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
        run: |
          set -euo pipefail
          python3 scripts/generate_bike_release.py --version "$RELEASE_VERSION"
          manifest="labs/bike/flags/releases/$RELEASE_VERSION.json"
          before=$(sha256sum "$manifest" | cut -d' ' -f1)
          python3 scripts/generate_bike_release.py --version "$RELEASE_VERSION"
          after=$(sha256sum "$manifest" | cut -d' ' -f1)
          test "$before" = "$after"
          echo "Bike Flag generation and same-version idempotency: PASS"

      - name: Verify target seed and Challenge answer match Manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"]
          root = pathlib.Path(".")
          manifest = json.loads((root / f"labs/bike/flags/releases/{version}.json").read_text())
          flag = manifest["flag"]
          assert manifest["version"] == version
          assert re.fullmatch(r"TTP\{[a-z2-7]{16}\}", flag)
          assert (root / "labs/bike/flags/root.txt").read_text().strip() == flag
          challenge = (root / "challenges/startpoint/bike/Bike.md").read_text()
          assert challenge.count(f'answer: "{flag}"') == 1
          assert challenge.count("kind: flag") == 1
          assert "lab: bike" in challenge
          print("Manifest, target root Flag and Challenge answer match: PASS")
          PY

      - name: Load expected Flag for the isolated acceptance run
        id: flag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("labs/bike/flags/releases") / (os.environ["RELEASE_VERSION"] + ".json")
          flag = json.loads(path.read_text())["flag"]
          print(f"::add-mask::{flag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"expected={flag}\\n")
          PY

      - name: Build Bike target for release acceptance
        run: docker build --pull --progress=plain -t ttp-bike:release -f labs/bike/Dockerfile labs/bike

      - name: Pull isolated player image and create private network
        run: |
          docker pull python:3.12-alpine
          docker network create --internal bike-release

      - name: Start release target and wait for health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bike-target --network bike-release --network-alias bike-target \\
            --memory 700m --cpus 1.5 --pids-limit 160 --security-opt no-new-privileges ttp-bike:release
          ready=0
          for attempt in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}' bike-target)
            health=$(docker inspect -f '{{.State.Health.Status}}' bike-target)
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then
              docker logs bike-target
              exit 1
            fi
            if [ "$health" = healthy ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1

      - name: Verify real SSTI Flag retrieval from independent player container
        env:
          EXPECTED_FLAG: ${{ steps.flag.outputs.expected }}
        run: |
          docker run --rm --network bike-release \\
            -v "$GITHUB_WORKSPACE/labs/bike/verify_ssti.py:/verify_ssti.py:ro" \\
            -e ALLOW_INTERNAL_TARGET=1 -e EXPECTED_FLAG \\
            python:3.12-alpine python /verify_ssti.py --url http://bike-target:80

      - name: Clean up release acceptance environment
        if: always()
        run: |
          docker logs bike-target 2>/dev/null || true
          docker rm -f bike-target 2>/dev/null || true
          docker network rm bike-release 2>/dev/null || true
          docker image inspect ttp-bike:release --format='IMAGE_SIZE_BYTES={{.Size}}' || true
          docker image rm ttp-bike:release 2>/dev/null || true

      - name: Commit generated release artifacts
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "labs/bike/flags/releases/$RELEASE_VERSION.json" \
            labs/bike/flags/root.txt \
            challenges/startpoint/bike/Bike.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(bike): generate Flag for $RELEASE_VERSION"
            git push origin "HEAD:$BRANCH_NAME"
          else
            echo "Bike release artifacts already match this version."
          fi

      - name: Summarize
        run: |
          echo "One random 80-bit Flag is stored in a versioned manifest and synchronized to the target seed and Challenge answer." >> "$GITHUB_STEP_SUMMARY"
          echo "Same-version runs reuse the manifest; a new version rotates the Flag." >> "$GITHUB_STEP_SUMMARY"
