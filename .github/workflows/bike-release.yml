name: Bike versioned Flag release

on:
  push:
    branches: [main]
    paths:
      - "labs/bike/flags/**"
      - "challenges/startpoint/bike/Bike.md"
      - "scripts/generate_bike_release.py"
      - ".github/workflows/bike-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Bike release version. Re-running the same version reuses its Flag."
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: bike-flag-release-${{ github.event.inputs.version || '0.1.0' }}
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate or reuse versioned random Flag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
        run: |
          set -euo pipefail
          python3 scripts/generate_bike_release.py --version "$RELEASE_VERSION"
          manifest="labs/bike/flags/releases/$RELEASE_VERSION.json"
          before=$(sha256sum "$manifest" | cut -d' ' -f1)
          python3 scripts/generate_bike_release.py --version "$RELEASE_VERSION"
          after=$(sha256sum "$manifest" | cut -d' ' -f1)
          test "$before" = "$after"
          echo "Bike Flag generation and same-version idempotency: PASS"

      - name: Verify target seed and Challenge answer match Manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"]
          root = pathlib.Path(".")
          manifest = json.loads((root / f"labs/bike/flags/releases/{version}.json").read_text())
          flag = manifest["flag"]
          assert manifest["version"] == version
          assert re.fullmatch(r"TTP\{[a-z2-7]{16}\}", flag)
          assert (root / "labs/bike/flags/root.txt").read_text().strip() == flag
          challenge = (root / "challenges/startpoint/bike/Bike.md").read_text()
          assert challenge.count(f'answer: "{flag}"') == 1
          assert challenge.count("kind: flag") == 1
          assert "lab: bike" in challenge
          print("Manifest, target root Flag and Challenge answer match: PASS")
          PY

      - name: Commit generated release artifacts
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "labs/bike/flags/releases/$RELEASE_VERSION.json" \
            labs/bike/flags/root.txt \
            challenges/startpoint/bike/Bike.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(bike): generate Flag for $RELEASE_VERSION"
            git push origin "HEAD:$BRANCH_NAME"
          else
            echo "Bike release artifacts already match this version."
          fi

      - name: Summarize
        run: |
          echo "One random 80-bit Flag is stored in a versioned manifest and synchronized to the target seed and Challenge answer." >> "$GITHUB_STEP_SUMMARY"
          echo "Same-version runs reuse the manifest; a new version rotates the Flag." >> "$GITHUB_STEP_SUMMARY"
